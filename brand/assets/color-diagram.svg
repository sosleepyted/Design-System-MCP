  <text x="538" y="732" font-size="10" fill="#001E2B" fill-opacity="0.60">#C2E8FF</text>
  <text x="622" y="732" font-size="10" fill="#001E2B" fill-opacity="0.60">#D9E8E2</text>
  <text x="706" y="732" font-size="10" fill="#001E2B" fill-opacity="0.60">#F0A639</text>
  <text x="790" y="732" font-size="10" fill="#001E2B" fill-opacity="0.60">#FF9932</text>
