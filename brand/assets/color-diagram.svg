  <text x="54" y="594" font-size="13" fill="#F0F0EB">Ink on dark #F0F0EB</text>
  <text x="434" y="594" font-size="11" fill="#001E2B" fill-opacity="0.60">Hero dark #0A0F14, used sparingly</text>

  <text x="34" y="660" font-size="13" font-weight="500" fill="#001E2B">Decorative sub-palette, never the CTA</text>
