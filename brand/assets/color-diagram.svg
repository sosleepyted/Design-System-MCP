<svg viewBox="0 0 900 760" xmlns="http://www.w3.org/2000/svg" font-family="Figtree, sans-serif" role="img" aria-label="UCM color palette diagram">
  <rect width="900" height="760" fill="#F5F5F3"/>
  <text x="34" y="52" font-size="24" font-weight="300" letter-spacing="-0.4" fill="#001E2B">UCM color palette</text>

  <text x="34" y="96" font-size="13" font-weight="500" fill="#001E2B">The triad</text>
  <rect x="34" y="108" width="180" height="72" rx="10" fill="#001E2B"/>
  <rect x="238" y="108" width="180" height="72" rx="10" fill="#F5F5F3" stroke="#001E2B" stroke-opacity="0.12"/>
  <rect x="442" y="108" width="180" height="72" rx="10" fill="#FCC224"/>
  <text x="34" y="200" font-size="12" fill="#001E2B">Ink</text>
  <text x="34" y="215" font-size="11" fill="#001E2B" fill-opacity="0.60">#001E2B</text>
  <text x="238" y="200" font-size="12" fill="#001E2B">Page</text>
  <text x="238" y="215" font-size="11" fill="#001E2B" fill-opacity="0.60">#F5F5F3</text>
  <text x="442" y="200" font-size="12" fill="#001E2B">Accent</text>
  <text x="442" y="215" font-size="11" fill="#001E2B" fill-opacity="0.60">#FCC224</text>

  <text x="34" y="256" font-size="13" font-weight="500" fill="#001E2B">Surfaces and tints</text>
  <rect x="34" y="268" width="180" height="56" rx="10" fill="#FFFFFF" stroke="#001E2B" stroke-opacity="0.12"/>
  <rect x="238" y="268" width="180" height="56" rx="10" fill="#F8F5EE" stroke="#001E2B" stroke-opacity="0.08"/>
  <rect x="442" y="268" width="180" height="56" rx="10" fill="#EDECEA"/>
  <rect x="646" y="268" width="180" height="56" rx="10" fill="#F7F7F7" stroke="#001E2B" stroke-opacity="0.08"/>
  <text x="34" y="344" font-size="12" fill="#001E2B">Card</text>
  <text x="34" y="359" font-size="11" fill="#001E2B" fill-opacity="0.60">#FFFFFF, cards only</text>
  <text x="238" y="344" font-size="12" fill="#001E2B">Cream tint</text>
  <text x="238" y="359" font-size="11" fill="#001E2B" fill-opacity="0.60">#F8F5EE</text>
  <text x="442" y="344" font-size="12" fill="#001E2B">Light gray</text>
  <text x="442" y="359" font-size="11" fill="#001E2B" fill-opacity="0.60">#EDECEA</text>
  <text x="646" y="344" font-size="12" fill="#001E2B">Faint gray</text>
  <text x="646" y="359" font-size="11" fill="#001E2B" fill-opacity="0.60">#F7F7F7</text>

  <text x="34" y="400" font-size="13" font-weight="500" fill="#001E2B">Status and accent states</text>
  <rect x="34" y="412" width="136" height="56" rx="10" fill="#0F5E2A"/>
  <rect x="190" y="412" width="136" height="56" rx="10" fill="#A32D2D"/>
  <rect x="346" y="412" width="136" height="56" rx="10" fill="#8A5A00"/>
  <rect x="502" y="412" width="136" height="56" rx="10" fill="#A96B00"/>
  <rect x="658" y="412" width="136" height="56" rx="10" fill="#FFD84D"/>
  <text x="34" y="488" font-size="12" fill="#001E2B">Success</text>
  <text x="34" y="503" font-size="11" fill="#001E2B" fill-opacity="0.60">#0F5E2A</text>
  <text x="190" y="488" font-size="12" fill="#001E2B">Danger</text>
  <text x="190" y="503" font-size="11" fill="#001E2B" fill-opacity="0.60">#A32D2D</text>
  <text x="346" y="488" font-size="12" fill="#001E2B">Warning text</text>
  <text x="346" y="503" font-size="11" fill="#001E2B" fill-opacity="0.60">#8A5A00</text>
  <text x="502" y="488" font-size="12" fill="#001E2B">Inline warning</text>
  <text x="502" y="503" font-size="11" fill="#001E2B" fill-opacity="0.60">#A96B00</text>
  <text x="658" y="488" font-size="12" fill="#001E2B">Accent hover</text>
  <text x="658" y="503" font-size="11" fill="#001E2B" fill-opacity="0.60">#FFD84D</text>

  <text x="34" y="544" font-size="13" font-weight="500" fill="#001E2B">Dark hero pairing, brand only</text>
