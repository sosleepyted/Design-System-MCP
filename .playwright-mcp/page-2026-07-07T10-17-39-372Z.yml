            - paragraph [ref=e284]: "The standard mark sits in its white container, never directly on yellow; #FF9932 on #FCC224 measures 1.3 and disappears."
          - paragraph [ref=e285]: "card + #001E2B + #FF9932"
      - list [ref=e286]:
        - listitem [ref=e287]: Never retype the wordmark. Place the provided asset, in any medium.
        - listitem [ref=e288]: Never uppercase. The wordmark is "ucm.", not "UCM."; uppercase UCM stays reserved for prose.
        - listitem [ref=e289]: Never restyle. The wordmark is always Nunito ExtraBold, never another face or weight.
        - listitem [ref=e290]: "Never recolor, drop, or resize the dot independently, and never use #FF9932 outside the wordmark."
        - listitem [ref=e291]: "On the accent the wordmark sits inside its white container, never directly on the yellow: the dot measures 1.3 on #FCC224 and disappears. The container is always a pill at maximum border radius, kept compact around the mark."
        - listitem [ref=e292]: The wordmark sits on the light neutrals, the dark surfaces, or its white container on the accent, never on the decorative mid-tones.
      - paragraph [ref=e293]: The dot alone measures about 2.0 against light surfaces, under the 3.0 UI bar. Logos are exempt from that requirement, and the dot never appears without the ink letterforms beside it.
