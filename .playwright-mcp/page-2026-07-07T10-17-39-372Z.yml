    - region "The rules that keep it honest" [ref=e235]:
      - heading "The rules that keep it honest" [level=2] [ref=e236]
      - list [ref=e237]:
        - listitem [ref=e238]: "Never pure black, never pure white as ink or surface. Ink is #001E2B, the page is #F5F5F3. White #FFFFFF exists only as a card surface and as text inside solid action surfaces."
        - listitem [ref=e239]: "Yellow stays scarce: never more than about 10 percent of any surface."
        - listitem [ref=e240]: Borders are navy with alpha, never gray and never black.
        - listitem [ref=e241]: "Hero dark #0A0F14 with ink-on-dark #F0F0EB is brand only, used sparingly."
        - listitem [ref=e242]: Gradient text is banned. The GlowButton radial is the one gradient in the system, brand only.
    - region "Logo usage" [ref=e243]:
      - heading "Logo usage" [level=2] [ref=e244]
      - paragraph [ref=e245]: The wordmark is "ucm." in Nunito ExtraBold, always lowercase, always ending in the dot. It is placed from the asset files and never retyped as styled text; brand/assets/logos/ holds the README that points at the Drive folder until the files land.
      - generic [ref=e246]:
        - 'figure "On light: ink #001E2B, the dot #FF9932" [ref=e247]':
          - paragraph [ref=e248]: ucm.
          - generic [ref=e249]: "On light: ink #001E2B, the dot #FF9932"
